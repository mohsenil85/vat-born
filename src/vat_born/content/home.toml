# The section every clone wakes in: the vat bay and the rooms around it, the same on every seed. Each path runs
# both ways; `minutes` is the walk either way, in ten-minute steps. Worldgen joins the decks to the gate: the
# corridor starts from that place, going that way.

start = "vat_bay"
places = ["vat_bay", "workshop", "store", "bulkhead"]
gate = { place = "bulkhead", direction = "north" }

[[paths]]
from = "vat_bay"
to = "workshop"
direction = "east"
minutes = 10

[[paths]]
from = "vat_bay"
to = "store"
direction = "west"
minutes = 10

[[paths]]
from = "vat_bay"
to = "bulkhead"
direction = "north"
minutes = 20
